<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Trading Journal</title>
<style>
:root{--bg:#0f1419;--panel:#1a2028;--panel-2:#232b36;--border:#2d3744;--text:#e6edf3;--muted:#8b96a5;--accent:#4a9eff;--green:#3fb950;--red:#f85149;--amber:#d29922;--input-bg:#0d1117;--touch:48px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}
.gs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.gd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.gd.ok{background:var(--green)}.gd.busy{background:var(--amber)}.gd.err{background:var(--red)}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 18px;cursor:pointer;font-size:14px;min-height:var(--touch);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:opacity .15s;width:100%}
.btn:active{opacity:.6}.bp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bd{background:transparent;border-color:var(--red);color:var(--red)}
main{padding:10px;padding-bottom:76px}.sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.sh{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sb{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;align-items:start}
.pc{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:0}
.pc .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pc .ch .ar{display:flex;align-items:center;gap:6px;flex:1;min-width:0}.pc .ch .ar input[type="text"]{width:auto;flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:10px 8px;border-radius:6px;font-size:15px;font-family:Menlo,monospace;min-height:var(--touch)}
.pc .ch .ar select{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:8px 2px;border-radius:6px;font-size:13px;min-height:var(--touch);max-width:72px}
.pc .db{background:transparent;border:1px solid var(--red);color:var(--red);width:40px;height:40px;border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;flex-shrink:0}
.ff{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.frow{display:flex;gap:6px}.frow .ff{flex:1;margin-bottom:6px}
.ff label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block}
.ff input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:12px 10px;border-radius:6px;font-size:16px;width:100%;font-family:Menlo,monospace;min-height:var(--touch)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.cv{flex:1;min-width:70px}.cv .cl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block}
.cv .cnv{padding:8px 0;font-size:15px;font-family:Menlo,monospace;font-weight:600;min-height:24px}
.cv .cnv.p{color:var(--green)}.cv .cnv.n{color:var(--red)}.cv .cnv.md{color:var(--muted)}
.err{color:var(--red);font-size:11px;margin-top:4px;text-align:center}
.em{text-align:center;padding:24px;color:var(--muted);font-size:14px}
.hl{max-height:360px;overflow-y:auto}.hi{padding:12px 14px;border-bottom:1px solid var(--border)}.hi:last-child{border-bottom:none}
.hi .h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hi .da{font-weight:600;font-family:Menlo,monospace;font-size:14px}
.hi .su{color:var(--muted);font-size:12px;margin:4px 0}
.hi .ac{display:flex;gap:8px}.hi .ac .btn{padding:6px 14px;font-size:12px;min-height:36px;width:auto}
.tt{position:fixed;bottom:80px;right:14px;left:14px;background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--green);padding:14px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;z-index:100;text-align:center}
.tt.show{opacity:1;transform:translateY(0)}.tt.err{border-left-color:var(--red)}
.modal-b{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-b.h{display:none}.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:380px;max-width:94vw}
.modal h2{margin:0 0 6px;font-size:16px}.modal p{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5}
.modal label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:6px;font-size:15px;font-family:Menlo,monospace;min-height:var(--touch)}
.modal input:focus{outline:none;border-color:var(--accent)}
.ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.mn{font-size:12px;color:var(--muted);margin-top:12px}.mn a{color:var(--accent)}
@media(min-width:768px){body{font-size:13px}header{padding:12px 20px}main{padding:16px 20px;padding-bottom:72px}}
.ghH{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:300;align-items:center;justify-content:center}.ghH.open{display:flex}.ghH .gc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;width:92%;max-width:360px;max-height:80vh}.ghH .gc h3{margin:0 0 8px;font-size:15px}.ghH .gc .gx{float:right;cursor:pointer;font-size:18px;color:var(--muted)}.ghH .gc dl{margin:0;font:13px/1.5 sans-serif}.ghH .gc dt{color:var(--accent);font-weight:700;margin-top:8px}.ghH .gc dd{color:var(--muted);margin:0 0 0 8px}
.ovr{display:flex;gap:16px;padding:12px 14px;flex-wrap:wrap}.ovc{flex:1;min-width:110px}.ocl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}.ocv{font-size:20px;font-family:Menlo,monospace;font-weight:700}
.st{width:100%;border-collapse:collapse;font-size:12px;font-family:Menlo,monospace;white-space:nowrap}.st th,.st td{padding:5px 10px;border:1px solid var(--border)}.st th{background:var(--panel-2);color:var(--muted);text-align:right;font-weight:600}.st th:first-child{text-align:left}.st td{text-align:right}.st td:first-child{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel-2);white-space:nowrap;font-family:inherit}.st tbody tr:hover td{background:rgba(255,255,255,.04)}
.sp-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:4px;padding:0 3px;height:15px;flex-shrink:0;-webkit-tap-highlight-color:transparent;line-height:1}.sp-btn:hover{background:var(--accent);color:#fff}.sp-btn:disabled{opacity:.4;cursor:default}
.lk-btn{background:transparent;border:1px solid var(--muted);color:var(--muted);border-radius:4px;font-size:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:4px;padding:0 3px;height:15px;flex-shrink:0;-webkit-tap-highlight-color:transparent;line-height:1}.lk-btn:hover{background:var(--muted);color:#fff}
.ff input:disabled{opacity:.5;cursor:not-allowed}
.ff label input[type="checkbox"]{width:15px;height:15px;min-height:0;flex:none;padding:0;margin:0 0 0 4px;background:var(--input-bg);border:1px solid var(--border);border-radius:3px;vertical-align:middle;accent-color:var(--accent)}
.tip-ico{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:9px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:middle;flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none;padding:0;line-height:1;background:transparent}
.tip-ico:hover,.tip-ico:focus{border-color:var(--accent);color:var(--accent);outline:none}
.tip-pop{position:fixed;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;width:260px;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.7);font-size:12px;line-height:1.5;display:none}
.tip-pop.show{display:block}
.tip-pop strong{display:block;color:var(--text);font-size:13px;font-weight:600;margin-bottom:4px}
.tip-pop .tp-d{color:var(--muted)}
.tip-pop .tp-f{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.tip-pop .tp-fl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.tip-pop .tp-fv{color:var(--accent);font-family:Menlo,monospace;font-size:11px;word-break:break-word}
.savebar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:flex-end;gap:8px;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,.4)}
.savebar .sb-info{flex:1;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar .btn{width:auto;min-height:40px;padding:8px 18px;font-size:13px}
</style>
</head>
<body>
<div class="modal-b h" id="ghM">
 <div class="modal"><h2>Connect to GitHub</h2><p>Snapshots stored as snapshots.json. Config in browser only.</p>
 <label>GitHub Username</label><input type="text" id="ghUser" placeholder="johndoe" autocomplete="off" />
 <label>Repository Name</label><input type="text" id="ghRepo" placeholder="trading-journal" autocomplete="off" />
 <label>Branch</label><input type="text" id="ghBranch" placeholder="main" autocomplete="off" />
 <label>Personal Access Token</label><input type="password" id="ghPat" placeholder="ghp_..." autocomplete="off" />
 <div class="mn">Token needs <b>repo</b> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=TradingJournal" target="_blank">Create one</a></div>
 <div class="ma"><button class="btn" id="ghMC" style="width:auto">Cancel</button><button class="btn bp" id="ghMS" style="width:auto">Save</button></div></div>
</div>
<header><h1>Trading Journal</h1><div style="display:flex;align-items:center;gap:8px"><input type="date" id="eD" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:14px;min-height:44px" /><div class="gs" id="ghS"><div class="gd" id="ghD"></div><span id="ghL" style="font-size:11px">Not</span></div></div></header>
<main>
<div class="sec"><div class="sh"><span>🗂️ Overview</span></div><div class="ovr"><div class="ovc"><span class="ocl">💼 Total Equity</span><div class="ocv" id="ovEq">—</div></div><div class="ovc"><span class="ocl">⚠️ Total Risk</span><div class="ocv" id="ovRk">—</div></div></div></div>
<div class="sec"><div class="sh"><span>📊 Simple Positions</span><div style="display:flex;align-items:center;gap:8px"><span id="sRS" style="font-size:12px;color:var(--muted)"></span><button class="btn bp" id="bAS" style="padding:4px 12px;font-size:12px;min-height:32px;width:auto">+ Simple</button></div></div><div class="sb" id="sB"></div></div>
<div class="sec"><div class="sh"><span>🔄 Hedged / Options</span><div style="display:flex;align-items:center;gap:8px"><span id="hRS" style="font-size:12px;color:var(--muted)"></span><button class="btn bp" id="bAH" style="padding:4px 12px;font-size:12px;min-height:32px;width:auto">+ Options</button></div></div><div class="sb" id="hB"></div></div>
<div class="sec"><div class="sh"><span>📋 Summary</span><button class="btn" id="bCT" style="padding:4px 12px;font-size:12px;width:auto;min-height:32px">Copy MD</button></div><div style="overflow-x:auto;padding:8px 12px"><table class="st" id="sumT"></table></div></div>
<div class="sec"><div class="sh"><span>📅 Snapshots</span><span id="hC" style="font-size:12px;color:var(--muted)"></span></div><div class="hl" id="hL"></div></div>
<div style="display:flex;gap:8px;margin:8px 0"><button class="btn" id="bE" style="flex:1">Export</button><label for="fI" class="btn" style="flex:1;text-align:center;cursor:pointer">Import</label><input type="file" id="fI" accept=".json" style="display:none" /></div>
</main>
<div class="tt" id="toast"></div>
<div id="tipPop" class="tip-pop"><strong id="tipT"></strong><div class="tp-d" id="tipD"></div><div class="tp-f" id="tipF"><span class="tp-fl">Formula</span><span class="tp-fv" id="tipFL"></span></div></div>
<div class="savebar"><span class="sb-info" id="sbInfo"></span><button class="btn bd" id="bC">🗑️ Clear</button><button class="btn bp" id="bS">💾 Save</button></div>

<script>
/* config */
var _r=false;CK='tjG',DU='changjulian17',DR='trading-journal',DB='main';
function gc(){try{return JSON.parse(localStorage.getItem(CK))||{}}catch(e){return{}}}
function hp(){return !!gc().pat}
var _c=null,_s=null;
function ru(){var c=gc();return 'https://raw.githubusercontent.com/'+(c.user||DU)+'/'+(c.repo||DR)+'/'+(c.branch||DB)+'/snapshots.json'}

async function gr(){st('busy','Loading...');try{var r=await fetch(ru());if(r.status==404){_c={};_s=null;st('ok');return{}}if(!r.ok)throw Error(r.status);_c=await r.json();_s=null;st('ok');return _c}catch(e){_c={};st('ok');return{}}}
async function gw(d){if(!hp()){toast('Need PAT - tap status');om();return}st('busy','Saving...');var c=gc(),u=c.user||DU,r=c.repo||DR,b=c.branch||DB,sh=_s;if(!sh){try{var x=await fetch('https://api.github.com/repos/'+u+'/'+r+'/contents/snapshots.json?ref='+b,{headers:hh()});if(x.ok)sh=(await x.json()).sha}catch(e){}}var body={message:'j '+(new Date().toISOString().slice(0,10)),content:btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2)))),branch:b};if(sh)body.sha=sh;try{var x=await fetch(wu(),{method:'PUT',headers:hh(),body:JSON.stringify(body)});if(!x.ok)throw Error((await x.text()).slice(0,60));var j=await x.json();_s=j.content.sha;_c=d;st('ok');toast('Saved!');var si=document.getElementById('sbInfo');if(si)si.textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){st('err');toast('Save failed','err');throw e}}
async function el(){if(_c===null)await gr();return _c}
function st(s,l){var d=document.getElementById('ghD'),lb=document.getElementById('ghL');d.className='gd '+s;lb.textContent=s==='ok'?(gc().repo||DR):(l||'Not')}
document.getElementById('ghS').addEventListener('click',function(e){e.preventDefault();om()});
document.getElementById('ghMC').addEventListener('click',cm);
document.getElementById('ghMS').addEventListener('click',async function(){var u=document.getElementById('ghUser').value.trim(),r=document.getElementById('ghRepo').value.trim(),b=document.getElementById('ghBranch').value.trim()||'main',p=document.getElementById('ghPat').value.trim();if(!u||!r||!p){alert('Fill all fields');return}localStorage.setItem(CK,JSON.stringify({user:u,repo:r,branch:b,pat:p}));_c=null;_s=null;cm();try{await gr();rh();toast('Connected to '+r)}catch(e){toast('Failed','err')}});
function om(){var c=gc();document.getElementById('ghUser').value=c.user||DU;document.getElementById('ghRepo').value=c.repo||DR;document.getElementById('ghBranch').value=c.branch||DB;document.getElementById('ghPat').value=c.pat||'';document.getElementById('ghM').classList.remove('h')}

/* state */
var _D=""+String.fromCharCode(8212);
var s={date:ti(),simple:[],hedged:[]};
function ti(){var d=new Date(),tz=d.getTimezoneOffset()*6e4;return new Date(d-tz).toISOString().slice(0,10)}

function bh(){return{ticker:'',side:'Long',qty:null,hedgeQty:null,multiplier:100,delta:null,vega:null,theta:null,premAdj:0,spot:null,expiry:'',strike:null,stop1:null,qty1:null,stop2:null,qty2:null,takeProfit:null}}
function n(v){if(v===null||v===void 0||v==='')return null;var x=Number(v);return isNaN(x)?null:x}
function fm(x,d){if(x===null||x===void 0||isNaN(x))return _D;return x.toLocaleString('en-GB',{minimumFractionDigits:d||2,maximumFractionDigits:d||2})}
function $m(x){if(x===null||x===void 0||isNaN(x))return _D;var v=Number(x);return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* calc */
function cS(p){var e=n(p.entry),sp1=n(p.stop1),q1=n(p.qty1)||0,sp2=n(p.stop2),q2=n(p.qty2)||0,tq=n(p.totalQty),tp=n(p.takeProfit);var rd=null,wt=null,rr=null;if(e!=null&&sp1!=null&&q1>0){var l1=sp1*q1,l2=0;wt=q1;if(sp2!=null&&q2>0){l2=sp2*q2;wt+=q2}rd=Math.abs(l1+l2)-e*wt}if(rd!=null&&rd!==0&&tp!=null)rr=Math.abs((tp-e)*wt/rd);var es=null,wsum=0,wq=0;if(sp1!=null&&q1>0){wsum+=sp1*q1;wq+=q1}if(sp2!=null&&q2>0){wsum+=sp2*q2;wq+=q2}if(wq>0)es=wsum/wq;return{ra:rd,q:wt,rr:rr,vq:tq!=null&&wt!=null?Math.abs(wt-tq)<0.001:true,es:es}}

async function fetchSpot(t){
  var yahooUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=1d';
  try{var r=await fetch(yahooUrl);if(r.ok){var j=await r.json(),p=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta&&j.chart.result[0].meta.regularMarketPrice;if(p!=null)return p;}}catch(e){}
  var proxyUrl='https://api.allorigins.win/get?url='+encodeURIComponent(yahooUrl);
  var r2=await fetch(proxyUrl);
  if(!r2.ok)throw new Error('Proxy error '+r2.status);
  var j2=await r2.json(),p2=null;
  try{var inner=JSON.parse(j2.contents);p2=inner&&inner.chart&&inner.chart.result&&inner.chart.result[0]&&inner.chart.result[0].meta&&inner.chart.result[0].meta.regularMarketPrice;}catch(e){}
  if(p2==null)throw new Error('No price for '+t);
  return p2;
}
