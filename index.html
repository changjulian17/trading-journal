<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Trading Journal</title>
<style>
:root{--bg:#0f1419;--panel:#1a2028;--panel-2:#232b36;--border:#2d3744;--text:#e6edf3;--muted:#8b96a5;--accent:#4a9eff;--green:#3fb950;--red:#f85149;--amber:#d29922;--input-bg:#0d1117;--touch:48px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}
.gs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.gd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.gd.ok{background:var(--green)}.gd.busy{background:var(--amber)}.gd.err{background:var(--red)}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 18px;cursor:pointer;font-size:14px;min-height:var(--touch);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:opacity .15s;width:100%}
.btn:active{opacity:.6}.bp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bd{background:transparent;border-color:var(--red);color:var(--red)}
main{padding:10px}.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tb .btn{flex:1 0 100%;font-size:14px;padding:10px 0}.bs{display:flex;gap:8px}.bs .btn{flex:1}.sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.sh{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sb{padding:12px}
.pc{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.pc .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pc .ch .ar{display:flex;align-items:center;gap:8px;flex:1}.pc .ch .ar input[type="text"]{width:auto;flex:1;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:10px 8px;border-radius:6px;font-size:15px;font-family:Menlo,monospace;min-height:var(--touch)}
.pc .ch .ar select{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:10px 6px;border-radius:6px;font-size:14px;min-height:var(--touch)}
.pc .db{background:transparent;border:1px solid var(--red);color:var(--red);width:40px;height:40px;border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;flex-shrink:0}
.ff{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ff label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block}
.ff input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:12px 10px;border-radius:6px;font-size:16px;width:100%;font-family:Menlo,monospace;min-height:var(--touch)}
.ff input:invalid{border-color:var(--red)}.ff input:valid{border-color:var(--green)}
.ff .v{padding:12px 0;font-size:16px;font-family:Menlo,monospace;color:var(--accent);font-weight:600;min-height:28px}
.ff .v.n{color:var(--red)}.ff .v.p{color:var(--green)}.ff .v.md{color:var(--muted)}
.em{text-align:center;padding:24px;color:var(--muted);font-size:14px}.err{color:var(--red);font-size:11px;margin-top:2px}
.hl{max-height:360px;overflow-y:auto}.hi{padding:12px 14px;border-bottom:1px solid var(--border)}.hi:last-child{border-bottom:none}
.hi .h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hi .da{font-weight:600;font-family:Menlo,monospace;font-size:14px}
.hi .su{color:var(--muted);font-size:12px;margin:4px 0}
.hi .ac{display:flex;gap:8px}.hi .ac .btn{padding:6px 14px;font-size:12px;min-height:36px;width:auto}
.toast{position:fixed;bottom:20px;right:14px;left:14px;background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--green);padding:14px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;z-index:100;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}.toast.err{border-left-color:var(--red)}
.modal-b{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-b.h{display:none}.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:380px;max-width:94vw}
.modal h2{margin:0 0 6px;font-size:16px}.modal p{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5}
.modal label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:6px;font-size:15px;font-family:Menlo,monospace;min-height:var(--touch)}
.modal input:focus{outline:none;border-color:var(--accent)}
.ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.mn{font-size:12px;color:var(--muted);margin-top:12px}.mn a{color:var(--accent)}
@media(min-width:768px){body{font-size:13px}header{padding:12px 20px}main{padding:16px 20px}.tb .btn{flex:0 1 auto}.bs{flex-wrap:nowrap}}
</style>
</head>
<body>
<div class="modal-b h" id="ghM">
  <div class="modal"><h2>Connect to GitHub</h2><p>Snapshots stored as <tt>snapshots.json</tt> in your repo. Config stored in browser only.</p>
  <label>GitHub Username</label><input type="text" id="ghUser" placeholder="johndoe" autocomplete="off" />
  <label>Repository Name</label><input type="text" id="ghRepo" placeholder="trading-journal" autocomplete="off" />
  <label>Branch</label><input type="text" id="ghBranch" placeholder="main" autocomplete="off" />
  <label>Personal Access Token</label><input type="password" id="ghPat" placeholder="ghp_..." autocomplete="off" />
  <div class="mn">Token needs <b>repo</b> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=TradingJournal" target="_blank">Create one</a></div>
  <div class="ma"><button class="btn" id="ghMC" style="width:auto">Cancel</button><button class="btn bp" id="ghMS" style="width:auto">Save</button></div></div>
</div>
<header><h1>Trading Journal</h1><div style="display:flex;align-items:center;gap:8px"><input type="date" id="eD" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:14px;min-height:44px" /><div class="gs" id="ghS"><div class="gd" id="ghD"></div><span id="ghL" style="font-size:11px">Not</span></div></div></header>
<main>
<div class="tb">
  <button class="btn bp" id="bS">Save</button>
  <button class="btn" id="bCY">Clone Yesterday</button>
</div>
<div class="bs">
  <button class="btn" id="bAS">+Simple</button>
  <button class="btn" id="bAH">+Options</button>
</div>
<div class="sec"><div class="sh"><span>Simple Positions</span><span id="sRS" style="font-size:12px;color:var(--muted)"></span></div><div class="sb" id="sB"></div></div>
<div class="sec"><div class="sh"><span>Hedged / Options</span><span id="hRS" style="font-size:12px;color:var(--muted)"></span></div><div class="sb" id="hB"></div></div>
<div class="sec"><div class="sh"><span>Snapshots</span><span id="hC" style="font-size:12px;color:var(--muted)"></span></div><div class="hl" id="hL"></div></div>
<div style="display:flex;gap:8px;margin:8px 0"><button class="btn" id="bC">Clear</button><button class="btn" id="bE">Export</button><button class="btn" id="bI">Import</button><input type="file" id="fI" accept=".json" style="display:none" /></div>
</main>
<div class="toast" id="toast"></div>
<script>
// Config
var CK='tjG',DU='changjulian17',DR='trading-journal',DB='main';
function gc(){try{return JSON.parse(localStorage.getItem(CK))||{}}catch(e){return{}}}
function hp(){return !!gc().pat}
var _c=null,_s=null;
function ru(){var c=gc();return 'https://raw.githubusercontent.com/'+(c.user||DU)+'/'+(c.repo||DR)+'/'+(c.branch||DB)+'/snapshots.json'}
function hh(){return{Authorization:'token '+gc().pat,'Content-Type':'application/json','Accept':'application/vnd.github+json'}}
function wu(){var c=gc();return 'https://api.github.com/repos/'+(c.user||DU)+'/'+(c.repo||DR)+'/contents/snapshots.json'}
async function gr(){st('busy','Loading...');try{var r=await fetch(ru());if(r.status==404){_c={};_s=null;st('ok');return{}}if(!r.ok)throw Error(r.status);_c=await r.json();_s=null;st('ok');return _c}catch(e){_c={};st('ok');return{}}}
async function gw(d){if(!hp()){toast('Need PAT - tap status');om();return}st('busy','Saving...');var c=gc(),u=c.user||DU,r=c.repo||DR,b=c.branch||DB,sh=_s;if(!sh){try{var x=await fetch('https://api.github.com/repos/'+u+'/'+r+'/contents/snapshots.json?ref='+b,{headers:hh()});if(x.ok)sh=(await x.json()).sha}catch(e){}}var body={message:'j '+(new Date().toISOString().slice(0,10)),content:btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2)))),branch:b};if(sh)body.sha=sh;try{var x=await fetch(wu(),{method:'PUT',headers:hh(),body:JSON.stringify(body)});if(!x.ok)throw Error((await x.text()).slice(0,60));var j=await x.json();_s=j.content.sha;_c=d;st('ok');toast('Saved!')}catch(e){st('err');toast('Save failed','err');throw e}}
async function el(){if(_c===null)await gr();return _c}
function st(s,l){var d=document.getElementById('ghD'),lb=document.getElementById('ghL');d.className='gd '+s;lb.textContent=s==='ok'?(gc().repo||DR):(l||'Not')}
document.getElementById('ghS').addEventListener('click',function(e){e.preventDefault();om()});
document.getElementById('ghMC').addEventListener('click',cm);
document.getElementById('ghMS').addEventListener('click',async function(){var u=document.getElementById('ghUser').value.trim(),r=document.getElementById('ghRepo').value.trim(),b=document.getElementById('ghBranch').value.trim()||'main',p=document.getElementById('ghPat').value.trim();if(!u||!r||!p){alert('Fill all fields');return}localStorage.setItem(CK,JSON.stringify({user:u,repo:r,branch:b,pat:p}));_c=null;_s=null;cm();try{await gr();rh();toast('Connected to '+r)}catch(e){toast('Failed','err')}});
function om(){var c=gc();document.getElementById('ghUser').value=c.user||DU;document.getElementById('ghRepo').value=c.repo||DR;document.getElementById('ghBranch').value=c.branch||DB;document.getElementById('ghPat').value=c.pat||'';document.getElementById('ghM').classList.remove('h')}
function cm(){document.getElementById('ghM').classList.add('h')}
// State
var s={date:ti(),simple:[],hedged:[]};
function ti(){var d=new Date(),tz=d.getTimezoneOffset()*6e4;return new Date(d-tz).toISOString().slice(0,10)}
function bs(){return{asset:'',side:'Long',entry:null,totalQty:null,stop1:null,qty1:null,stop2:null,qty2:null,takeProfit:null,notes:''}}
function bh(){return{ticker:'',side:'Long',qty:null,multiplier:100,delta:null,premAdj:0,spot:null,stop1:null,qty1:null,stop2:null,qty2:null,takeProfit:null}}
function n(v){if(v===null||v===void 0||v==='')return null;var x=Number(v);return isNaN(x)?null:x}
function vl(v){if(v===''||v===null||v===void 0)return true;var x=Number(v);return !isNaN(x)&&x>=0}
function fm(x,d){if(x===null||x===void 0||isNaN(x))return(String.fromCharCode(8212));return Number(x).toLocaleString('en-GB',{minimumFractionDigits:d||2,maximumFractionDigits:d||2})}
function $m(x){if(x===null||x===void 0||isNaN(x))return(String.fromCharCode(8212));var v=Number(x);return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Risk calc
function cS(p){var e=n(p.entry),sp1=n(p.stop1),q1=n(p.qty1)||0,sp2=n(p.stop2),q2=n(p.qty2)||0,tq=n(p.totalQty),tp=n(p.takeProfit);var rd=null,wt=null,cb=null,rr=null;if(e!=null&&sp1!=null&&q1>0){rd=Math.abs(e-sp1)*q1;wt=q1;if(sp2!=null&&q2>0){rd+=Math.abs(e-sp2)*q2;wt+=q2}}if(e!=null&&sp1!=null&&tk==0&&tp!=null&&sp1!==e)rr=-(tp-e)/(sp1-e);return{ra:rd,q:wt,cb:e*(wt||0),rr:rr,vq:tq!=null&&wt!=null?Math.abs(wt-tq)<0.001:true}}
function cH(p){var q=n(p.qty),m=n(p.multiplier),d=n(p.delta),pa=n(p.premAdj)||0,sp=n(p.spot),s1=n(p.stop1),q1=n(p.qty1)||0,s2=n(p.stop2),q2=n(p.qty2)||0,tp=n(p.takeProfit);var cd=null,risk=null,rr=null;if(q!=null&&m!=null&&d!=null)cd=d*m*q-pa;if(cd!=null&&sp!=null&&(s1!=null||s2!=null)){var l1=(s1!=null&&q1!=null)?s1*q1:0,l2=(s2!=null&&q2!=null)?s2*q2:0;risk=Math.abs(l1+l2)-sp*cd}if(cd!=null&&sp!=null&&tp!=null&&risk!=null&&risk!==0)rr=Math.abs((tp-sp)*cd/risk);return{cd:cd,risk:risk,rr:rr}}
// Render
function render(){document.getElementById('eD').value=s.date;rS();rH();rh()}
function rS(){var c=document.getElementById('sB');c.innerHTML='';var t=0;if(!s.simple.length){c.innerHTML='<div class="em">Tap +Simple</div>';return}s.simple.forEach(function(p,i){var r=cS(p);if(r.ra)t+=Math.abs(r.ra);var ve=r.vq?true:false;c.innerHTML+='<div class="pc"><div class="ch"><div class="ar"><input type="text" data-si="'+i+'" data-sk="asset" value="'+esc(p.asset)+'" placeholder="QQQ" autocomplete="off"/><select data-si="'+i+'" data-sk="side"><option value="Long"'+(p.side==='Long'?' selected':'')+'>Long</option><option value="Short"'+(p.side==='Short'?' selected':'')+'>Short</option></select></div><button class="db" data-ds="'+i+'">X</button></div>'
+'<div class="ff"><label>Entry</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-si="'+i+'" data-sk="entry" value="'+(p.entry||'')+'" /></div>'
+'<div class="ff"><label>Total Qty</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-si="'+i+'" data-sk="totalQty" value="'+(p.totalQty||'')+'"/></div>'
+'<div class="ff"><label>Stop 1</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-si="'+i+'" data-sk="stop1" value="'+(p.stop1||'')+'"/></div>'
+'<div class="ff"><label>Qty 1</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-si="'+i+'" data-sk="qty1" value="'+(p.qty1||'')+'"/></div>'
+'<div class="ff"><label>Stop 2</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-si="'+i+'" data-sk="stop2" value="'+(p.stop2||'')+'"/></div>'
+'<div class="ff"><label>Qty 2</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-si="'+i+'" data-sk="qty2" value="'+(p.qty2||'')+'"/></div>'
+'<div class="ff"><label>Take Profit</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-si="'+i+'" data-sk="takeProfit" value="'+(p.takeProfit||'')+'"/></div>'
+'<div class="ff"><label>Notes</label><input type="text" data-si="'+i+'" data-sk="notes" value="'+esc(p.notes)+'" autocomplete="off"/></div>'
+'<div class="ff"><div style="display:flex;gap:8px;flex-wrap:wrap">'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">Risk $</span><div class="v '+(r.ra!=null?'p':'md')+'">'+(r.ra!=null?$m(r.ra):String.fromCharCode(8212))+'</div></div>'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">Cost</span><div class="v '+(r.cb!=null?'p':'md')+'">'+(r.cb!=null?$m(r.cb):String.fromCharCode(8212))+'</div></div>'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">R/R</span><div class="v '+(r.rr!=null?(r.rr>=1?'p':'n'):'md')+'">'+(r.rr!=null?fm(r.rr,2)+'x':String.fromCharCode(8212))+'</div></div>'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">Tot Qty</span><div class="v '+(r.q!=null?'p':'md')+'">'+(r.q!=null?fm(r.q,2):String.fromCharCode(8212))+'</div></div>'
+(ve?'':'<div style="flex:0 0 100%"><span class="err">Qty sum differs from total</span></div>')
+'</div></div></div>'});document.getElementById('sRS').textContent=s.simple.length?s.simple.length+' trade'+(s.simple.length>1?'s':'')+(t?', risk '+$m(t):''):''}
function rH(){var c=document.getElementById('hB');c.innerHTML='';var t=0;if(!s.hedged.length){c.innerHTML='<div class="em">Tap +Options</div>';return}s.hedged.forEach(function(p,i){var r=cH(p);if(r.risk)t+=Math.abs(r.risk);c.innerHTML+='<div class="pc"><div class="ch"><div class="ar"><input type="text" data-hi="'+i+'" data-hk="ticker" value="'+esc(p.ticker)+'" placeholder="TLT" autocomplete="off"/><select data-hi="'+i+'" data-hk="side"><option value="Long"'+(p.side==='Long'?' selected':'')+'>Long</option><option value="Short"'+(p.side==='Short'?' selected':'')+'>Short</option></select></div><button class="db" data-dh="'+i+'">X</button></div>'
+'<div class="ff"><label>Spot</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="spot" value="'+(p.spot||'')+'"/></div>'
+'<div class="ff"><label>Qty</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-hi="'+i+'" data-hk="qty" value="'+(p.qty||'')+'"/></div>'
+'<div class="ff"><label>Multiplier</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-hi="'+i+'" data-hk="multiplier" value="'+(p.multiplier||100)+'"/></div>'
+'<div class="ff"><label>Delta</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="delta" value="'+(p.delta||'')+'"/></div>'
+'<div class="ff"><label>Prem Adj</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="premAdj" value="'+(p.premAdj||'')+'"/></div>'
+'<div class="ff"><label>Stop 1</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="stop1" value="'+(p.stop1||'')+'"/></div>'
+'<div class="ff"><label>Qty 1</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-hi="'+i+'" data-hk="qty1" value="'+(p.qty1||'')+'"/></div>'
+'<div class="ff"><label>Stop 2</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="stop2" value="'+(p.stop2||'')+'"/></div>'
+'<div class="ff"><label>Qty 2</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-hi="'+i+'" data-hk="qty2" value="'+(p.qty2||'')+'"/></div>'
+'<div class="ff"><label>Take Profit</label><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-hi="'+i+'" data-hk="takeProfit" value="'+(p.takeProfit||'')+'"/></div>'
+'<div class="ff"><div style="display:flex;gap:8px;flex-wrap:wrap">'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">Cash D</span><div class="v '+(r.cd!=null?'p':'md')+'">'+(r.cd!=null?fm(r.cd,2):String.fromCharCode(8212))+'</div></div>'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">Risk</span><div class="v '+(r.risk!=null?'p':'md')+'">'+(r.risk!=null?$m(r.risk):String.fromCharCode(8212))+'</div></div>'
+'<div style="flex:1;min-width:80px"><span class="v md" style="font-size:10px">R/R</span><div class="v '+(r.rr!=null?(r.rr>=1?'p':'n'):'md')+'">'+(r.rr!=null?fm(r.rr,2)+'x':String.fromCharCode(8212))+'</div></div>'
+'</div></div></div>'});document.getElementById('hRS').textContent=s.hedged.length?s.hedged.length+' trade'+(s.hedged.length>1?'s':'')+(t?', risk '+$m(t):''):''}
function rh(){var all=_c||{},dates=Object.keys(all).sort().reverse(),list=document.getElementById('hL');list.innerHTML='';document.getElementById('hC').textContent=dates.length?dates.length+' snap'+(dates.length>1?'s':''):'';if(!dates.length){list.innerHTML='<div class="em">Empty</div>';return}dates.forEach(function(d){var snap=all[d],nS=(snap.simple||[]).length,nH=(snap.hedged||[]).length;list.innerHTML+='<div class="hi"><div class="h2"><div class="da">'+d+'</div><div class="ac"><button class="btn" data-ld="'+d+'" style="width:auto">Load</button><button class="btn bd" data-dl="'+d+'" style="width:auto">Del</button></div></div><div class="su">'+nS+' s, '+nH+' h'+(snap.savedAt?' @ '+snap.savedAt.slice(11,16):'')+'</div></div>'})}
