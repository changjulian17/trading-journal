<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Trading Journal — Login</title>
<style>
:root{--bg:#0f1419;--panel:#1a2028;--border:#2d3744;--text:#e6edf3;--muted:#8b96a5;--accent:#4a9eff;--red:#f85149;--input-bg:#0d1117;--touch:48px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 24px;width:340px;max-width:100%}
h1{font-size:17px;font-weight:600;margin-bottom:6px}
p{color:var(--muted);font-size:13px;margin-bottom:20px}
label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:6px;font-size:15px;font-family:Menlo,monospace;min-height:var(--touch)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:16px;background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;border-radius:8px;padding:12px 18px;font-size:14px;min-height:var(--touch);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.7}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:12px;margin-top:10px;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 Trading Journal</h1>
  <p>Enter the shared password to continue.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus />
    <button type="submit" id="btn">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('btn'), err = document.getElementById('err'), pw = document.getElementById('pw').value;
  btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
  try {
    var r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify({password: pw})});
    if (r.ok) { location.href = '/'; return; }
    var j = await r.json().catch(function(){return {}});
    err.textContent = j.error || 'Login failed';
  } catch (e) {
    err.textContent = 'Network error';
  }
  btn.disabled = false; btn.textContent = 'Unlock';
});
</script>
</body>
</html>
