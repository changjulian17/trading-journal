name: Deploy to VPS

# Fires on every push to main (i.e. every merged PR) and can be re-run by
# hand from the Actions tab. Runs on a self-hosted runner living ON the VPS
# itself — the runner polls GitHub over an outbound connection to pick up
# jobs, so there's no inbound SSH involved. (GitHub-hosted runners reaching
# in over SSH hit a hard wall here: Hostinger's network silently drops
# inbound connections from GitHub's cloud IP ranges — confirmed by
# Hostinger support — so that approach was a dead end for this VPS.)
#
# Repo is public: this workflow only triggers on push to `main` (+ manual
# dispatch), never on `pull_request`, so an external PR can't make this
# runner execute anything by itself — only code actually merged to `main`
# runs here. Review PRs (especially to this file, the Dockerfile, or
# docker-compose.yml) before merging, since after merge that code runs with
# real access to the VPS, not a disposable cloud VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-journal-vps]
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/trading-journal
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          docker compose build
          docker compose up -d
          docker compose logs --tail=50 trading-journal
