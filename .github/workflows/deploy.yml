name: Deploy to VPS

# Fires on every push to main (i.e. every merged PR) and can be re-run by
# hand from the Actions tab. Runs the exact steps from README.md's "Routine
# deploys" section, over SSH, on a GitHub-hosted runner — no self-hosted
# runner or third-party deploy action required.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Missing one or more required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY" >&2
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -p "${VPS_PORT:-22}" \
              -i "$KEY_FILE" \
              "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/trading-journal
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            docker compose build
            docker compose up -d
            docker compose logs --tail=50 trading-journal
          REMOTE
